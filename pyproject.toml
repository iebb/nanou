[project]
name = "nanou"
version = "0.1.0"
license = "GPL-3.0-or-later"
description = "NanoKVM console access over a UU tunnel"
requires-python = ">=3.10"
dependencies = [
    "aiortc==1.15.0",
    "aiohttp==3.14.3",
    "python-engineio==4.13.5",
    "python-socketio==5.16.4",
    "aioice==0.10.2+uutun1",
    "protobuf==7.36.0",
]

[tool.uv]
package = false

[tool.uv.sources]
aioice = { path = "vendor/aioice" }
